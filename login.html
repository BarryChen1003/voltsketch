<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登入 - HardwareAI</title>
  <meta name="description" content="登入 HardwareAI 帳號。">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://hardware-ai.org/login.html">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta property="og:site_name" content="HardwareAI">
  <meta property="og:title" content="登入 - HardwareAI">
  <meta property="og:description" content="登入 HardwareAI 帳號。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hardware-ai.org/login.html">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .auth-wrap { max-width: 420px; margin: 48px auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
      .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
      .auth-tab { flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; }
      .auth-tab.active { background: var(--accent, #1f4fd1); color: #fff; border-color: var(--accent, #1f4fd1); }
      .auth-wrap input { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 6px 0; }
      .auth-msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
      .muted { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">VS</div><div><h1>HardwareAI 硬體實驗室</h1><p data-i18n="lg_title">帳號登入</p></div></div>
        <nav class="main-nav"><a href="index.html" class="nav-link">← 回線路圖</a>  <a href="upgrade.html" class="nav-link" data-i18n="nav_upgrade">升級 VIP</a><a href="contact.html" class="nav-link">聯絡資訊</a>
        </nav>
      </header>

      <div class="auth-wrap">
        <div class="auth-tabs">
          <button class="auth-tab active" data-mode="login" data-i18n="lg_login">登入</button>
          <button class="auth-tab" data-mode="signup" data-i18n="lg_signup">註冊</button>
          <button class="auth-tab" data-mode="forgot" data-i18n="lg_forgot">忘記密碼</button>
        </div>

        <div id="demoNote" class="muted" hidden style="margin-bottom:10px;color:#b45309" data-i18n="lg_demo">
          ⚠ 尚未設定 Supabase（auth-config.js）。目前為本機 demo 模式，無法真正登入。
        </div>

        <div id="mainStep">
          <input id="email" type="email" placeholder="email" autocomplete="email" />
          <input id="password" type="password" placeholder="密碼（至少 6 碼）" data-i18n-placeholder="lg_pw_ph" autocomplete="current-password" />
          <button class="primary-button" id="submitBtn" style="width:100%;margin-top:6px" data-i18n="lg_login">登入</button>
        </div>

        <!-- 驗證碼步驟：註冊後（或登入時發現帳號未驗證）才顯示 -->
        <div id="codeStep" hidden>
          <p id="codeHint" class="muted" style="margin:0 0 8px;font-size:13px;line-height:1.7"></p>
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"
                 placeholder="信裡的驗證碼" data-i18n-placeholder="lg_code_ph"
                 style="text-align:center;letter-spacing:6px;font-size:18px" />
          <button class="primary-button" id="codeGo" style="width:100%;margin-top:6px" data-i18n="lg_code_go">驗證並登入</button>
          <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px">
            <a href="#" id="codeResend" data-i18n="lg_code_resend">重寄驗證碼</a>
            <a href="#" id="codeBack" data-i18n="lg_code_back">用別的信箱</a>
          </div>
        </div>

        <!-- 重設密碼回來時走這一步。Supabase 的信件連結會把人導回本頁並帶上 recovery token，
             舊版沒有這一段，所以使用者只會看到登入表單（站主 2026-08-21 回報）。 -->
        <div id="recoverStep" hidden>
          <p class="muted" style="margin:0 0 8px;font-size:13px;line-height:1.7" data-i18n="lg_newpw_hint">
            你是從重設密碼的信件連結進來的，請直接設定新密碼。</p>
          <input id="newPw" type="password" autocomplete="new-password"
                 placeholder="新密碼（至少 6 碼）" data-i18n-placeholder="lg_newpw_ph" />
          <button class="primary-button" id="newPwGo" style="width:100%;margin-top:6px" data-i18n="lg_newpw_go">更新密碼</button>
        </div>

        <div id="msg" class="auth-msg"></div>
      </div>
    </div>

    <script src="./vendor/supabase-js-2.112.3.min.js"></script>
    <script src="./auth-config.js?v=2026-07-04a"></script>
  <script src="./observe.js?v=1"></script>
    <script src="./auth.js?v=2026-08-18a"></script>
    <script>
      const $ = id => document.getElementById(id);
      const T = (k, v) => window.I18N ? window.I18N.t(k, v) : k;  // i18n.js 稍後載入；互動時已可用
      let mode = 'login';
      const msg = (t, ok) => { const m = $('msg'); m.textContent = t; m.style.color = ok ? '#16a34a' : '#dc2626'; };

      if (!Auth.enabled()) $('demoNote').hidden = false;

      // 送出鈕標籤依 mode＋語言（不能掛 data-i18n，否則切語言會蓋掉非 login 模式的標籤）
      const updateBtn = () => { $('submitBtn').textContent = mode === 'login' ? T('lg_login') : mode === 'signup' ? T('lg_signup') : T('lg_send_reset'); };
      setTimeout(updateBtn, 0);  // i18n.js 於本 script 之後載入，延到下一輪
      document.addEventListener('vs-lang-change', updateBtn);

      document.querySelectorAll('.auth-tab').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); mode = b.dataset.mode;
        $('password').style.display = (mode === 'forgot') ? 'none' : '';
        updateBtn();
        msg('');
        // 切分頁時退出驗證碼步驟，否則會停在一個跟目前分頁無關的畫面
        if (!$('codeStep').hidden) { $('codeStep').hidden = true; $('mainStep').hidden = false; }
      }));

      // 登入成功後要去哪：白名單只收站內頁檔名，擋開放轉址
      function goNext() {
        const nx = new URLSearchParams(location.search).get('next');
        const dest = (nx && /^[\w-]+\.html$/.test(nx)) ? nx : 'index.html';
        setTimeout(() => location.href = dest, 800);
      }

      // 驗證碼步驟（Supabase 的 signup OTP）。信件模板用 {{ .Token }} 才會寄出驗證碼。
      // 位數由 Supabase 的 Email OTP length 決定（可調），所以畫面文案不要寫死位數。
      let pendingEmail = '';
      function showCode(email, hintKey) {
        pendingEmail = email;
        $('mainStep').hidden = true;
        $('codeStep').hidden = false;
        $('codeHint').textContent = T(hintKey || 'lg_code_hint', { email });
        $('code').value = '';
        $('code').focus();
      }
      function showMain() {
        pendingEmail = '';
        $('codeStep').hidden = true;
        $('mainStep').hidden = false;
        msg('');
      }

      $('submitBtn').addEventListener('click', async () => {
        if (!Auth.enabled()) { msg(T('lg_cfg')); return; }
        const email = $('email').value.trim(), pw = $('password').value;
        try {
          if (mode === 'login') {
            const { error } = await Auth.signIn(email, pw);
            // 帳號存在但還沒驗證 → 直接把人帶到驗證碼步驟，不要只丟一句英文錯誤
            if (error && /not confirmed|not verified/i.test(error.message || '')) {
              await Auth.resendSignup(email);
              showCode(email, 'lg_need_verify');
              return;
            }
            if (error && /invalid login credentials/i.test(error.message || '')) { msg(T('lg_bad_creds')); return; }
            if (error) throw error; msg(T('lg_ok'), true);
            goNext();
          } else if (mode === 'signup') {
            const { error } = await Auth.signUp(email, pw);
            if (error) throw error;
            msg('');
            showCode(email);
          } else {
            const { error } = await Auth.reset(email);
            if (error) throw error; msg(T('lg_reset_ok'), true);
          }
        } catch (e) { msg(e.message || T('lg_fail')); }
      });

      /* ---------- 重設密碼 ----------
       * Supabase 寄出的連結會回到本頁，網址上帶著 recovery token；supabase-js 讀完就把它
       * 從網址上抹掉，並發出 PASSWORD_RECOVERY 事件。兩個訊號都接：
       *   - 事件：最可靠，但可能在我們訂閱之前就發生
       *   - 網址還留著 type=recovery：補上面那個時間差
       * 連結過期或用過的話不會有 session —— 這時要明講，不要讓人對著登入框發呆。 */
      function showRecover() {
        $('mainStep').hidden = true;
        $('codeStep').hidden = true;
        $('recoverStep').hidden = false;
        document.querySelector('.auth-tabs').style.display = 'none';
        msg('');
        setTimeout(() => $('newPw').focus(), 0);
      }

      (function initRecovery() {
        if (!Auth.enabled()) return;
        const c = Auth.raw();
        let shown = false;
        const arrive = () => { if (!shown) { shown = true; showRecover(); } };
        try {
          c.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') arrive(); });
        } catch (e) { /* 舊版 SDK 沒這個事件也不至於壞掉 */ }
        const looksRecovery = /type=recovery/.test(location.hash || '') || /[?&]code=/.test(location.search || '');
        if (!looksRecovery) return;
        arrive();
        // 沒有 session＝連結失效或已用過
        setTimeout(async () => {
          const u = await Auth.user();
          if (!u) {
            $('recoverStep').hidden = true;
            $('mainStep').hidden = false;
            document.querySelector('.auth-tabs').style.display = '';
            msg(T('lg_link_dead'));
          }
        }, 1500);
      })();

      $('newPwGo').addEventListener('click', async () => {
        const pw = $('newPw').value;
        if (!pw || pw.length < 6) { msg(T('lg_newpw_short')); return; }
        try {
          const { error } = await Auth.updatePassword(pw);
          if (error) throw error;
          msg(T('lg_newpw_ok'), true);
          history.replaceState(null, '', location.pathname);   // 把 token 從網址上清掉
          goNext();
        } catch (e) { msg(e.message || T('lg_fail')); }
      });
      $('newPw').addEventListener('keydown', e => { if (e.key === 'Enter') $('newPwGo').click(); });

      $('codeGo').addEventListener('click', async () => {
        const token = $('code').value.trim();
        if (!token) { msg(T('lg_code_empty')); return; }
        try {
          const { error } = await Auth.verifySignup(pendingEmail, token);
          if (error) { msg(T('lg_code_bad')); return; }   // 碼錯或過期，訊息統一，不洩漏哪一種
          msg(T('lg_ok'), true);
          goNext();
        } catch (e) { msg(e.message || T('lg_fail')); }
      });
      $('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('codeGo').click(); });

      $('codeResend').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          const { error } = await Auth.resendSignup(pendingEmail);
          if (error) throw error;
          msg(T('lg_code_resent'), true);
        } catch (err) { msg(err.message || T('lg_fail')); }
      });
      $('codeBack').addEventListener('click', (e) => { e.preventDefault(); showMain(); });

      // Google / 手機登入已移除（2026-07-04 站主指示）：僅 email。要恢復見 git 歷史 + SETUP-AUTH.md。
    </script>
    <script src="./i18n.js?v=2026-08-25c"></script>
</body>
</html>
