name: Supabase 備份（pg_dump → artifact）

# 免費 Supabase 無自動備份。此排程每週 dump 整個 public schema，
# 上傳為 GitHub Actions artifact（僅 repo 協作者可下載，保留 90 天）。
# 重要：dump 含用戶 email 等 PII，"絕不" commit 進這個公開 repo；只放 artifact。
#
# ─────────────────────────────────────────────────────────────
# 【你要做的事，只做一次】
#   加一個 repo secret，名稱 SUPABASE_DB_PASSWORD，值就是**資料庫密碼本身**。
#   不是連線字串、不是網址，就只有密碼那幾個字。
#   位置：repo → Settings → Secrets and variables → Actions → New repository secret
# ─────────────────────────────────────────────────────────────
#
# 為什麼不再貼整串連線字串（2026-08-15 連踩三次才改成這樣）：
#   ① 密碼含 @ ] 之類的字元沒編碼 → URI 被切錯，錯誤訊息是看不懂的 socket 路徑
#   ② Direct connection 主機只有 IPv6，GitHub Actions 連不上
#   ③ Pooler 的使用者名稱要 postgres.<ref>，寫成 postgres 會回
#      "password authentication failed"，看起來像密碼錯，其實是使用者錯
#   主機、port、使用者名稱這三個是固定值，寫死在下面 env 就好；
#   使用者唯一要提供的只有密碼，而密碼走 PGPASSWORD 環境變數**不需要任何編碼**。
#
# 這些值哪裡來（Supabase → Connect → Session pooler）。換區域或換專案才需要改：
#   PGHOST     aws-1-ap-southeast-2.pooler.supabase.com   ← 2026-08-15 實測連得上（52.62.122.103）
#   PGUSER     postgres.dmkxjawjrmltmrmkebbs              ← postgres.<專案ref>，那個點不能少
#   PGPORT     5432                                       ← session mode；6543 是 transaction，pg_dump 不能用

on:
  schedule:
    - cron: '31 5 * * 0'      # 每週日 05:31 UTC
  workflow_dispatch: {}        # 也可手動觸發（金流上線前先跑一次驗證）

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      PGHOST: aws-1-ap-southeast-2.pooler.supabase.com
      PGPORT: '5432'
      PGUSER: postgres.dmkxjawjrmltmrmkebbs
      PGDATABASE: postgres
    steps:
      - name: 檢查 secret 是否已設
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::warning::未設 SUPABASE_DB_PASSWORD secret，跳過備份。見本檔頂部說明。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安裝 Postgres 17 client（對齊 Supabase 版本）
        if: steps.guard.outputs.ok == 'true'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # 先用一句 select 1 確認「連得上而且密碼對」，再花時間 dump。
      # 這樣失敗訊息只會有一種可能：密碼不對。其他變因都被上面的 env 寫死了。
      - name: 連線測試
        if: steps.guard.outputs.ok == 'true'
        env:
          RAW_PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "pg_dump: $(pg_dump --version)"
          echo "連線目標: $PGUSER@$PGHOST:$PGPORT/$PGDATABASE"

          # 貼 secret 時最常見的三種壞法。這裡只在「有問題」時才印，
          # 而且只講形狀不講內容——這個 repo 是公開的，Actions log 任何人看得到。
          PW=$(printf '%s' "$RAW_PW" | tr -d '\r\n')
          TRIMMED=$(printf '%s' "$PW" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$PW" != "$TRIMMED" ]; then
            echo "::warning::secret 首尾有空白或換行，已自動去掉再連。建議回去重貼一次乾淨的。"
            PW="$TRIMMED"
          fi
          case "$PW" in
            *://*|*@*) echo "::error::secret 內容看起來是整串連線字串，不是密碼。只放密碼那幾個字。" ; exit 1 ;;
          esac
          case "$PW" in
            *\[*|*\]*) echo "::error::secret 裡有中括號，多半是 [YOUR-PASSWORD] 的括號沒刪乾淨。" ; exit 1 ;;
          esac

          export PGPASSWORD="$PW"
          if psql -w -c 'select 1' > /dev/null 2>psql-err.txt; then
            echo "連線成功"
          else
            cat psql-err.txt
            if grep -q 'password authentication failed' psql-err.txt; then
              echo "::error::密碼不對。"
              echo "::error::注意：訊息裡的 user \"postgres\" 是 pooler 的正常顯示，不代表使用者名稱設錯——"
              echo "::error::PGUSER 已經是 postgres.<專案ref>，.<ref> 只用於路由，登入身分本來就是 postgres。"
              echo "::error::請到 Supabase → Project Settings → Database → Reset database password 重設一組"
              echo "::error::只有英數字的密碼，複製後**立刻**更新 SUPABASE_DB_PASSWORD（重設頁面關掉就看不到了）。"
            fi
            exit 1
          fi

      - name: pg_dump public schema
        if: steps.guard.outputs.ok == 'true'
        env:
          RAW_PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          # 跟上一步同樣的清理，否則首尾空白會讓這步又失敗一次
          PGPASSWORD=$(printf '%s' "$RAW_PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export PGPASSWORD
          STAMP=$(date -u +%Y%m%d-%H%M)
          OUT="supabase-dump-${STAMP}.sql"
          # --no-owner/--no-privileges：還原到新專案不卡權限；只 dump public schema。
          pg_dump --schema=public --no-owner --no-privileges --file="$OUT"
          gzip -9 "$OUT"
          ls -lh "${OUT}.gz"
          echo "DUMP_FILE=${OUT}.gz" >> "$GITHUB_ENV"

      # public 的每一張表都 references auth.users(id)，但 auth 不在 public 裡。
      # 只還原 public 的話：使用者一個都沒有、外鍵全部指空、等於誰付過錢也認不出來。
      # auth schema 屬於 supabase_auth_admin，這個角色不一定 dump 得動，
      # 所以這步「允許失敗」——public 那份照樣產出，不要因為這步把整個備份弄壞。
      - name: pg_dump auth（帳號；允許失敗）
        id: authdump
        if: steps.guard.outputs.ok == 'true'
        continue-on-error: true
        env:
          RAW_PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          PGPASSWORD=$(printf '%s' "$RAW_PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export PGPASSWORD
          STAMP=$(date -u +%Y%m%d-%H%M)
          OUT="supabase-auth-${STAMP}.sql"
          # 只取還原身分真正需要的表；整個 auth schema 有大量 Supabase 內部狀態，還原反而會打架。
          if pg_dump --no-owner --no-privileges --data-only \
               --table=auth.users --table=auth.identities --file="$OUT" 2>dump-err.txt; then
            gzip -9 "$OUT"
            ls -lh "${OUT}.gz"
            echo "AUTH_FILE=${OUT}.gz" >> "$GITHUB_ENV"
            echo "auth 備份成功"
          else
            echo "::warning::auth schema dump 失敗，本次備份只有 public。訊息形狀如下（不印內容）："
            sed -e 's/[A-Za-z0-9._%+-]*@[A-Za-z0-9.-]*/<redacted>/g' dump-err.txt | head -5
            exit 1
          fi

      - name: 提醒 auth 沒備到
        if: steps.guard.outputs.ok == 'true' && steps.authdump.outcome == 'failure'
        run: |
          echo "::warning::這份備份不含帳號資料。若要用它做災難還原，使用者、方案歸屬都救不回來。"
          echo "::warning::處理方式見 BACKUP-RESTORE-DRILL.md（本機檔，未進 repo）。"

      - name: 上傳 artifact（僅協作者可下載，保留 90 天）
        if: steps.guard.outputs.ok == 'true'
        # v4 跑在 Node 20，GitHub 已標記棄用（現在是被強制拉到 Node 24 跑）。
        # v7 是官方 README 範例用的版本，name/path/retention-days/if-no-files-found
        # 四個參數語意沒變（2026-08-15 查 README 確認），所以只換版本號。
        uses: actions/upload-artifact@v7
        with:
          name: supabase-dump
          # 兩份都收；auth 那份失敗時 AUTH_FILE 是空的，多一行空 path 不影響上傳。
          path: |
            ${{ env.DUMP_FILE }}
            ${{ env.AUTH_FILE }}
          retention-days: 90
          if-no-files-found: error
