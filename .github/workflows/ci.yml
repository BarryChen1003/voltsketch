name: CI (品質關卡)

# push / PR 到 main 時擋壞檔：全 JS 語法檢查 + 幾何/資料檢查器 + JSON/SQL 冒煙。
# 任何一步失敗 → job 紅 → 你在 Actions 頁與 email 看得到，別讓壞檔上線給用戶。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1) 全站根目錄 .js 語法檢查（node --check）。壞括號/漏逗號一律擋下。
      #    只掃根目錄產品檔，排除第三方（Ref/、rtk/、node_modules 等子目錄）。
      - name: node --check all root JS
        run: |
          set -e
          fail=0
          for f in ./*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::語法錯誤（node --check 未過）"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "全部根目錄 JS 語法 OK"

      # 2) 公版 footprint 幾何檢查器（213 料件：覆蓋率/pad 唯一/無 NaN/環寬>0）
      - name: reffp-check（公版 footprint 幾何）
        run: node reffp-check.js

      # 2b) PCB 編輯器邏輯層回歸測試（nextRef/snapTarget/history/貼上/多選刪除…）
      - name: pcb-logic.test（編輯器邏輯回歸）
        run: node pcb-logic.test.js

      # 2c) Gerber/Excellon 匯出正確性（跨 8 片公版：表頭/座標界內/鑽孔對齊 pad…）
      - name: gerber-check（匯出正確性）
        run: node gerber-check.js

      # 2c-2) Gerber 讀回驗證：把匯出的 Gerber 解析回幾何，跟原始板逐條比對。
      #       gerber-check 只驗結構，線寬全給錯它照樣是綠的——這支才擋得住。
      - name: gerber-readback（讀回幾何比對）
        run: node gerber-readback.js
      - name: odb-check（ODB++ 結構與 readback）
        run: node odb-check.js
      - name: netmodel.test（net 一級物件：改名列舉／阻抗閉式解／差分對量測）
        run: node netmodel.test.js
      - name: fpinst.test（元件實例／封裝庫分離：手改過的不可被蓋掉）
        run: node fpinst.test.js
      - name: pcb3d.test（3D 板框串接與元件高度）
        run: node pcb3d.test.js
      - name: shove.test（推擠：不該推的時候不可推）
        run: node shove.test.js
      - name: pourgeom.test（鋪銅布林：面積對解析解）
        run: node pourgeom.test.js

      # 2c-3) 鋪銅幾何：依序重放 Gerber 的極性（LPD/LPC），量避讓間隙與熱風焊盤輻條。
      #       避讓少挖 0.1mm 板子就是短路，只數行數看不出來。
      - name: gerber-pour（鋪銅避讓幾何）
        run: node gerber-pour.test.js

      # 2c-4) 製造功能（淚滴／縫合孔／鑽孔表／拼板）：算出來的幾何合不合法
      - name: pcb-mfg（製造功能幾何）
        run: node pcb-mfg.test.js

      # 2c-5) 那些幾何有沒有真的進到匯出檔；並把前後端兩份鑽孔表釘在一起
      - name: gerber-mfg（製造功能匯出）
        run: node gerber-mfg.test.js

      # 2c-6) 線路圖 → PCB：封裝必須是真的（PartsLib / FootprintGen），
      #       對不出來的要誠實列出，不可編一個假方塊塞過去。
      - name: sch2pcb（線路圖轉 PCB）
        run: node sch2pcb.test.js

      # 2c-7) DXF 板框：單位、弧線、**封閉性**、來回一趟幾何不跑掉
      - name: dxf（板框匯入匯出）
        run: node dxf.test.js

      # 2c-8) 線路圖 ↔ PCB 選取連動：回音防護與訊息驗證（雙向連動最容易壞在這兩處）
      - name: crossprobe（選取連動）
        run: node crossprobe.test.js

      # 2c-9) STEP 3D 匯出：參照完整性、流形性（每條邊剛好兩用且反向）、尤拉示性數
      - name: step（3D 匯出）
        run: node step.test.js

      # 2c-10) 圖片轉絲印：像素→mm 換算、區塊合併、**太細的絲印印不出來**要抓得到
      - name: silkimg（圖片轉絲印）
        run: node silkimg.test.js

      # 2c-11) 鋪銅孤島：跟自己網路斷開的浮空銅，DRC 不會報但那是天線
      - name: pour（鋪銅孤島）
        run: node pour.test.js

      # 2c-12) 盲埋孔：路由跨層範圍、匯出依跨層分檔、板廠能力判定
      - name: blindvia（盲埋孔）
        run: node blindvia.test.js

      # 2c-13) 2026-08-27 那一批：本機 §6 一直有跑，但沒有一支進過 CI，
      #        於是 push 上去不會擋。2026-08-28 補齊。
      - name: ipc2581（IPC-2581 ＋ 組裝圖）
        run: node ipc2581.test.js
      - name: odb-cmp（ODB++ 元件與 netlist）
        run: node odb-cmp.test.js
      - name: pour-default（布林鋪銅成為匯出預設，重算冪等）
        run: node pour-default.test.js
      - name: true-arc（真圓弧端到端：導角→DRC→G02/G03→解析回來）
        run: node true-arc.test.js
      - name: pcb-index（共用空間索引：不可以漏候選）
        run: node pcb-index.test.js
      - name: pcb-arc（圓弧幾何：細分誤差要真的量弦高）
        run: node pcb-arc.test.js
      - name: drc-arc（DRC 對真弧：差 0.001mm 也要抓到）
        run: node drc-arc.test.js
      - name: drc-incremental（增量 DRC：只擔心漏報）
        run: node drc-incremental.test.js
      - name: gerber-import（Gerber/Excellon 匯入 round-trip）
        run: node gerber-import.test.js
      - name: alien-import（Eagle／LTspice：認不得的不可硬塞）
        run: node alien-import.test.js
      - name: spice（MNA：全對閉式解）
        run: node spice.test.js
      - name: sch-spice（線路圖轉網表：拒絕分析的時機）
        run: node sch-spice.test.js
      - name: footprint-editor（自製封裝：對規格書數字）
        run: node footprint-editor.test.js
      - name: fp-lib（封裝庫：登入後本機那份不可以不見）
        run: node fp-lib.test.js
      - name: designs（雲端專案：清單不可撈 data、存一半不可清掉另一半）
        run: node designs.test.js
      - name: autoplace（自動擺件：不重疊、可重現、鎖定的不動）
        run: node autoplace.test.js
      - name: annotate（refdes 編號：fill 不可動既有編號）
        run: node annotate.test.js
      - name: backannotate（refdes／net 回寫）
        run: node backannotate.test.js

      # 2d) i18n key 完整性：pcbT/I18N.t 用到的 key 必須有定義（防 UI 顯示原始 key）
      - name: i18n-check（key 完整性）
        run: node i18n-check.js
      - name: i18n-quad-check（字典本身四語齊全：少一個 ja 不會報錯，只是日文看到中文）
        run: node i18n-quad-check.js

      # 2e) 知識卡原理說明排版器：分段只改排版、內容零丟失
      - name: knowledge-format.test（排版不改內容）
        run: node knowledge-format.test.js
      - name: ds-compare.test（datasheet 比對：抽不到不編造）
        run: node ds-compare.test.js
      - name: pin-extract.test（腳位抽取：抽不到不吐半成品）
        run: node pin-extract.test.js
      - name: ic-extract.test（建庫驗證器：編的值進不了資料庫）
        run: node ic-extract.test.js
      - name: net-label.test（net 命名：同名相連、空白不亂併）
        run: node net-label.test.js
      - name: sch-bus.test（匯流排：幹線不可以把整束訊號短在一起）
        run: node sch-bus.test.js
      - name: knowledge-art-audit（知識卡圖：接腳接上、字不貼圖）
        run: node knowledge-art-audit.js --strict --quiet

      # 2f) 知識卡電路圖：接線不得被吸附塌成零長（＝那條線根本沒畫出來）
      - name: circuit-check（電路圖接線）
        run: node circuit-check.js --strict

      # 2f2) 接線沒接上（差幾 px）／多出線頭（穿過接點還往外伸）。
      #      符號內部筆畫靠 data-sym 標記排除，誤報才降到可用。
      #      selftest 先證明檢查本身抓得到那兩種缺陷，再跑棘輪比對 wire-gap-baseline.json。
      - name: wire-gap-check 自我測試
        run: node wire-gap-check.js --selftest
      - name: wire-gap-check（接線缺口/多出線頭 · 棘輪）
        run: node wire-gap-check.js --strict

      # 2f3) 元件不得互疊：兩個元件符號／方塊壓在一起（電容疊電容、電感戳進方塊…）。
      #      三條判準：筆畫真交叉、方塊互疊 >2px、bbox 重疊 ≥ 較小者 35%。
      #      旋轉符號（橋式整流 45°）、串接引線、虛線容器框都有豁免，誤報為 0。
      - name: symbol-overlap-check 自我測試
        run: node symbol-overlap-check.js --selftest
      - name: symbol-overlap-check（元件不互疊 · 棘輪）
        run: node symbol-overlap-check.js --strict

      # 2g) 鐵律：圖表文字不得壓到圖形或別的文字。
      #     2026-07-27 把「框標題」判定從「文字中心在框內」改成「整個字框在框內」：
      #     原本騎在框邊上的標籤（背靠背（雙向斷）、CC…）會被誤認成框自己的標題而漏報。
      #     改嚴後翻出的 17 處已於 2026-07-27 全部清完 → 回到 --strict：壓到一個字就擋。
      - name: svg-overlap-check（圖字不重疊 · 鐵律）
        run: node svg-overlap-check.js --strict

      # 2g2) 圖上的字四語齊全（硬規矩 6）。從實際畫出來的 SVG 反推該翻的字，
      #      不是 grep 字串常數，所以陣列/樣板字串/helper 傳進去的字都跑不掉。
      - name: art-i18n-check（圖上的字四語齊全）
        run: node art-i18n-check.js --strict
      - name: art-lang-render.test（三種圖的換語言路徑）
        run: node art-lang-render.test.js
      - name: ui-i18n-check（編輯器畫面文字四語齊全）
        run: node ui-i18n-check.js --strict
      - name: html-i18n-check（HTML 不准寫死中文）
        run: node html-i18n-check.js --strict
      - name: dead-button-check（按鈕都要接上處理器，不准有死按鈕）
        run: node dead-button-check.js
      - name: vendor-check（不准回頭用 CDN；vendor 檔要與紀錄的雜湊相符）
        run: node vendor-check.js --strict
      - name: csp-hash（inline script 的雜湊要與 _headers 同步）
        run: node csp-hash.js --check
      - name: asset-leak-check（.assetsignore 雙向：檢查腳本不上公開站、站台在用的檔不被誤擋）
        run: node asset-leak-check.js
      - name: ci-parity-check（§6 清單與這個檔必須一致，缺一支就是 push 上去不會擋）
        run: node ci-parity-check.js
      - name: interview-i18n-check（面試題庫四語齊全）
        run: node interview-i18n-check.js --strict
      - name: news-i18n-check（新技術：四語＋每則都要有出處）
        run: node news-i18n-check.js --strict
      # 金流保險絲：live 模式不准用沙盒憑證／沙盒網址，缺值直接 throw。
      # 先證明它抓得到那些缺陷（前 7 條），再相信它。
      - name: ecpay-config.test（正式模式不准 fallback 沙盒）
        run: node ecpay-config.test.mjs
      - name: plan-dates.test（續購日期：不吃掉剩餘天數、月底不溢位）
        run: node plan-dates.test.mjs

      # 2g3) 同一張圖換語言＝字寬變、座標不變 → 中文乾淨不代表英文乾淨。
      #      鐵律類（重疊、塌陷線）四語都必須 0；棘輪類各語言各有基線（*.en/ja/ko.json），
      #      因為譯文長度不同，拿中文基線卡英文只會每次都紅。
      - name: 四語幾何檢查（en/ja/ko）
        run: |
          set -e
          for L in en ja ko; do
            echo "── $L ──"
            node svg-overlap-check.js --strict --lang=$L
            node circuit-check.js --strict --lang=$L
            node knowledge-art-audit.js --strict --quiet --lang=$L
            node wire-gap-check.js --strict --lang=$L
            node symbol-overlap-check.js --strict --lang=$L
          done

      # 2h) 面試題庫那 38 張圖：同一條鐵律，外加規格（svg 要有 width、viewBox ≤720、字級 ≥10）。
      #     svg-overlap-check 只掃知識卡的 CIRCUITS2，面試題的圖原本沒有任何守衛。
      #     node 沒有 DOM，字寬靠內建字元寬度表推算（在瀏覽器實測 1051 個文字節點校正過，
      #     實測/估算 中位數 1.000）。門檻用 2px 而非瀏覽器版的 0.5px，因為估算本身有 ±4% 誤差。
      #     先跑自我測試：把標籤推到線上／推出畫布／字級調成 8px，證明抓得到，再跑正式檢查。
      - name: interview-diagram-check 自我測試
        run: node interview-diagram-check.test.js
      - name: interview-diagram-check（面試題圖字不重疊 · 鐵律）
        run: node interview-diagram-check.js

      # 3) JSON 設定檔冒煙：能 parse 才算數
      - name: JSON parse 冒煙
        run: |
          set -e
          for f in skills-lock.json manifest.json; do
            if [ -f "$f" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
                && echo "$f OK" \
                || { echo "::error file=$f::JSON parse 失敗"; exit 1; }
            fi
          done

      # 4) 關鍵 HTML script 引用完整性：pcb.html / index.html / knowledge.html
      #    引用的本地 .js（含 ?v= 版本參數）檔案必須真的存在，避免 404。
      - name: HTML script 引用存在性
        run: |
          node -e '
            const fs = require("fs");
            const pages = ["index.html","pcb.html","knowledge.html","interview.html","upgrade.html","login.html"];
            let bad = 0;
            for (const p of pages) {
              if (!fs.existsSync(p)) continue;
              const html = fs.readFileSync(p, "utf8");
              const re = /<script[^>]+src=["\x27]\.\/([^"\x27?]+)(?:\?[^"\x27]*)?["\x27]/g;
              let m;
              while ((m = re.exec(html))) {
                const f = m[1];
                if (!fs.existsSync(f)) { console.error(`::error file=${p}::引用不存在的檔 ${f}`); bad = 1; }
              }
            }
            if (bad) process.exit(1);
            console.log("HTML script 引用全部存在");
          '
